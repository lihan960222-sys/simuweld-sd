[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "sfmarc-workbench"
version = "0.3.0"
description = "本机 sfMarc 模型工具"
requires-python = ">=3.12"
dependencies = [
  "meshioplusplus==17.11.0",
  "numpy>=2.0,<3",
  "scipy>=1.14,<2",
  "fortranformat>=2,<3",
  "fastapi>=0.115,<1",
  "uvicorn>=0.30,<1",
  "python-multipart>=0.0.20,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "httpx>=0.27,<1", "pyinstaller>=6,<7"]

[project.scripts]
sfmarc-workbench = "sfmarc_workbench.launcher:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
